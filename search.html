<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Relic Lanka Tours</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <nav>
    <div class="container">
      <div class="logo">Relic Lanka Tours</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="tours.html">Tours</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="search.html">Search</a></li>
      </ul>
    </div>
  </nav>

  <div id="searchBlock" style="margin-top: 40px; margin-bottom: 40px;">
    <div class="container">
      <div class="block-title">
        <h1>Search</h1>
      </div>
      <input type="text" id="searchInput" placeholder="Search tours, destinations, experiences..." style="max-width: 600px; margin: 0 auto; display: block; padding: 15px; font-size: 1.1rem;">
    </div>
  </div>

  <section>
    <div class="container">
      <div id="searchResults">
        <div class="state empty">Enter a keyword to search</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Relic Lanka Tours</p>
    </div>
  </footer>

  <!-- Templates -->
  <template id="resultItemTemplate">
    <div class="card" style="margin-bottom: 20px;">
      <div class="card-content">
        <span class="type-badge" style="background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; text-transform: uppercase;"></span>
        <h3 class="card-title" style="margin-top: 10px;"></h3>
        <a href="" class="btn btn-small">View</a>
      </div>
    </div>
  </template>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/search.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relic Lanka Tours - All Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <nav>
    <div class="container">
      <div class="logo">Relic Lanka Tours</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="tours.html">Tours</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="search.html">Search</a></li>
      </ul>
    </div>
  </nav>

  <!-- Tours Header Block -->
  <div id="toursHeaderBlock" class="block-title" style="margin-top: 40px;">
    <div class="container">
      <h1>Our Tours</h1>
      <p>Explore our wide range of packages designed for you.</p>
    </div>
  </div>

  <!-- Filter/Search -->
  <div class="container" style="margin-bottom: 30px;">
    <input type="text" id="toursSearchInput" placeholder="Filter tours by name..." style="max-width: 400px; margin: 0 auto; display: block;">
  </div>

  <!-- Tours List Block -->
  <section id="toursListBlock">
    <div class="container">
      <div id="toursGrid" class="grid">
        <div class="state loading">Loading tours...</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Relic Lanka Tours</p>
    </div>
  </footer>

  <!-- Templates -->
  <template id="tourCardTemplate">
    <div class="card">
      <img src="" alt="Tour Image">
      <div class="card-content">
        <h3 class="card-title"></h3>
        <p class="card-meta"></p>
        <p class="short-desc" style="font-size: 0.9rem; margin-bottom: 15px;"></p>
        <a href="" class="btn btn-small">View Details</a>
      </div>
    </div>
  </template>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/tours.js"></script>
</body>
</html>

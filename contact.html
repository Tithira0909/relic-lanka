<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Relic Lanka Tours</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <nav>
    <div class="container">
      <div class="logo">Relic Lanka Tours</div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="tours.html">Tours</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="search.html">Search</a></li>
      </ul>
    </div>
  </nav>

  <div class="block-title" style="margin-top: 40px;">
    <div class="container">
      <h1>Contact Us</h1>
    </div>
  </div>

  <section id="contactContentBlock">
    <div class="container">
      <div id="pageContent" class="state loading">Loading content...</div>

      <!-- Contact Details -->
      <div id="contactDetails" style="margin-top: 40px; padding: 20px; background: #f9f9f9; border-radius: 8px;">
        <h3>Contact Details</h3>
        <p><strong>Email:</strong> <span id="settingEmail">...</span></p>
        <p><strong>Phone:</strong> <span id="settingPhone">...</span></p>
        <p><strong>Address:</strong> <span id="settingAddress">...</span></p>
      </div>
    </div>
  </section>

  <!-- General Inquiry Form -->
  <section>
    <div class="container">
      <h3>Send us a Message</h3>
      <form id="generalInquiryForm" style="max-width: 600px;">
        <div class="form-group"><input type="text" name="fullName" placeholder="Full Name" required></div>
        <div class="form-group"><input type="email" name="email" placeholder="Email" required></div>
        <div class="form-group"><input type="text" name="phone" placeholder="Phone"></div>
        <div class="form-group"><textarea name="message" rows="5" placeholder="Message" required></textarea></div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Relic Lanka Tours</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
